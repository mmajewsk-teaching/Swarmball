name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

jobs:
  test:
    name: Build Docker image and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker compose build test

      - name: Run tests
        run: docker compose run --rm test
